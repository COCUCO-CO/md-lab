schema_version: 1
project_defaults:
  temperature_kelvin: 300.0
  pressure_bar: 1.0
  friction_per_ps: 1.0
  timestep_fs: 2.0
  nonbonded_cutoff_nm: 1.0
  ewald_error_tolerance: 0.0005
  constraints: HBonds
  rigid_water: true
  remove_cm_motion: true
  platform: CUDA
  cuda_precision: mixed
  deterministic_forces: false
  output_stride_ps: 10.0
  checkpoint_stride_ps: 100.0
  seed_base: 20260710

phase1:
  system: lennard_jones_argon
  particles: 256
  sigma_nm: 0.34
  epsilon_kj_mol: 0.997
  particle_mass_da: 39.948
  reduced_density: 0.80
  temperature_kelvin: 120.0
  cutoff_nm: 1.0
  switch_nm: 0.9
  profiles:
    quick:
      nvt_ps: 20.0
      nve_ps: 20.0
      output_stride_ps: 0.2
    teaching:
      nvt_ps: 200.0
      nve_ps: 200.0
      output_stride_ps: 1.0
  gates:
    max_temperature_relative_error: 0.15
    max_nve_energy_drift_kj_mol_ns_per_particle: 1.0
    rdf_first_peak_min: 1.1
    rdf_first_peak_max: 4.5

